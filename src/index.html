<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Audio Player <span id="version" class="version"></span></h1>
      <button type="button" id="open-folder" class="button">Open folder…</button>
      <input id="folder-input" type="file" webkitdirectory multiple hidden />
    </header>
    <main id="drop-zone">
      <p id="status" role="status" aria-live="polite">Open a folder, or drag one here.</p>
      <p class="hint">Keyboard: <kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> skip 5 seconds</p>
      <nav id="tree" aria-label="Files"></nav>
    </main>
    <footer id="player" aria-label="Player"></footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
