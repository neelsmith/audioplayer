project:
  type: website
  output-dir: quarto_build

version: "1.3.1"
metadata:
  date: today
  
execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - minty
      - brand
    toc: true

website:
  title: "audioplayer"
  page-footer:
    center: "`audioplayer` version **{{< meta version >}}**, website last updated {{< meta date >}}"

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd                 
      - text: "Catalogs"
        file: cataloging/index.qmd      
          

    right:
      - icon: person-circle
        menu:
          - text: "audioplayer on github"
            href: https://github.com/neelsmith/audioplayer        
          - text: "Neel Smith: other hobby projects"
            href: https://neelsmith.github.io/avocational/
        aria-label: Home 
